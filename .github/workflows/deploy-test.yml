name: DijiRehber manual test deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dijirehber-worker-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dijirehber-test
    timeout-minutes: 25
    steps:
      - name: Check explicit test release approval
        env:
          DIJI_DEPLOY_READY: ${{ vars.DIJI_DEPLOY_READY }}
        run: test "$DIJI_DEPLOY_READY" = 'true' || { echo 'Release not approved'; exit 1; }
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate Cloudflare test bindings
        env:
          DIJI_TEST_D1_DATABASE_ID: ${{ vars.DIJI_TEST_D1_DATABASE_ID }}
          DIJI_TEST_R2_BUCKET_NAME: ${{ vars.DIJI_TEST_R2_BUCKET_NAME }}
        run: node scripts/prepare-test-worker.mjs
      - name: Deploy ONLY to isolated test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
